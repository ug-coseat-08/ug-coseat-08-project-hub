name: Project task
description: Record a scoped project, documentation, research, or engineering task.
title: "[Task]: "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What problem should this task solve or what outcome should it produce?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description: Link relevant requirements, meeting records, screenshots, failures, or client information.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true before this task is complete.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Identify access, decisions, people, systems, or other work needed first.
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Explain how the result will be checked and what evidence will be retained.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Suggested owner
      placeholder: GitHub username or TBD
  - type: input
    id: reviewer
    attributes:
      label: Suggested reviewer
      placeholder: GitHub username or TBD
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, or client-material considerations
